{% extends "base.html" %}

{% block title %}Login - Food Truck Works{% endblock %}

{% block content %}

<section class="section">
    <div class="container">

        <div class="columns is-centered">
            <div class="column is-5-tablet is-4-desktop">

                <div class="box">

                    <picture>
                        <img
                            src="/static/images/food-truck-works-logo.png"
                            alt="Food Truck Works"
                            class="ftw-logo ftw-logo--auth"
                            width="1039"
                            height="883"
                        >
                    </picture>

                    <p class="subtitle has-text-centered">
                        Sign in to your account
                    </p>

                    {% if error %}
                        <div class="notification is-danger is-light">
                            {{ error }}
                        </div>
                    {% endif %}

                    {% if message %}
                        <div class="notification is-success is-light">
                            {{ message }}
                        </div>
                    {% endif %}

                    <form method="post">

                        <div class="field">
                            <label
                                class="label"
                                for="email"
                            >
                                Email
                            </label>

                            <div class="control">
                                <input
                                    class="input"
                                    type="email"
                                    id="email"
                                    name="email"
                                    required
                                >
                            </div>
                        </div>

                        <div class="field">
                            <label
                                class="label"
                                for="password"
                            >
                                Password
                            </label>

                            <div class="control">
                                <input
                                    class="input"
                                    type="password"
                                    id="password"
                                    name="password"
                                    required
                                >
                            </div>
                            <p class="help has-text-right mt-2">
                                <a href="/forgot-password">
                                    Forgot your password?
                                </a>
                            </p>
                        </div>

                        <div class="field mt-5">
                            <div class="control">
                                <button
                                    type="submit"
                                    class="button is-primary is-fullwidth"
                                >
                                    Log In
                                </button>
                            </div>
                        </div>

                    </form>

                    <div class="has-text-centered mt-4">
                        <p class="mb-3"><a href="/login/store-display">Store Display sign-in</a></p>
                        <a href="/resend-verification">
                            Resend verification email
                        </a>
                    </div>

                </div>

            </div>
        </div>

    </div>
</section>

{% endblock %}
