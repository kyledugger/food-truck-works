{% extends "base.html" %}

{% block title %}Create Account - Food Truck Works{% endblock %}

{% block content %}

<section class="section">
    <div class="container">
        <div class="columns is-centered">
            <div class="column is-5-tablet is-4-desktop">
                <div class="box">

                    <picture>
                        <img
                            src="/static/images/food-truck-works-logo.png"
                            alt="Food Truck Works"
                            class="ftw-logo ftw-logo--auth"
                            width="1039"
                            height="883"
                        >
                    </picture>

                    <h1 class="title is-4 has-text-centered">
                        Create your account
                    </h1>

                    {% if error %}
                        <div class="notification is-danger is-light">
                            {{ error }}
                        </div>
                    {% endif %}

                    <form method="post">
                        <div class="field">
                            <label class="label" for="organization_name">
                                Organization Name
                            </label>
                            <div class="control">
                                <input
                                    class="input"
                                    type="text"
                                    id="organization_name"
                                    name="organization_name"
                                    value="{{ organization_name or '' }}"
                                    required
                                    autofocus
                                >
                            </div>
                        </div>

                        <div class="columns">
                            <div class="column">
                                <div class="field">
                                    <label class="label" for="first_name">First Name</label>
                                    <div class="control">
                                        <input
                                            class="input"
                                            type="text"
                                            id="first_name"
                                            name="first_name"
                                            value="{{ first_name or '' }}"
                                            maxlength="100"
                                            autocomplete="given-name"
                                            required
                                        >
                                    </div>
                                </div>
                            </div>
                            <div class="column">
                                <div class="field">
                                    <label class="label" for="last_name">Last Name</label>
                                    <div class="control">
                                        <input
                                            class="input"
                                            type="text"
                                            id="last_name"
                                            name="last_name"
                                            value="{{ last_name or '' }}"
                                            maxlength="100"
                                            autocomplete="family-name"
                                            required
                                        >
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="field">
                            <label class="label" for="email">Email</label>
                            <div class="control">
                                <input
                                    class="input"
                                    type="email"
                                    id="email"
                                    name="email"
                                    value="{{ email or '' }}"
                                    required
                                >
                            </div>
                        </div>

                        <div class="field">
                            <label class="label" for="phone">Phone</label>
                            <div class="control">
                                <input
                                    class="input"
                                    type="tel"
                                    id="phone"
                                    name="phone"
                                    value="{{ phone or '' }}"
                                    autocomplete="tel"
                                >
                            </div>
                            <p class="help">Optional.</p>
                        </div>

                        <div class="field">
                            <label class="label" for="password">Password</label>
                            <div class="control">
                                <input
                                    class="input"
                                    type="password"
                                    id="password"
                                    name="password"
                                    minlength="10"
                                    maxlength="128"
                                    autocomplete="new-password"
                                    required
                                >
                            </div>
                        </div>

                        <p class="help mb-4">
                            Use 10 to 128 characters. Spaces are allowed.
                        </p>

                        <div class="field">
                            <label class="label" for="confirm_password">Confirm Password</label>
                            <div class="control">
                                <input
                                    class="input"
                                    type="password"
                                    id="confirm_password"
                                    name="confirm_password"
                                    minlength="10"
                                    maxlength="128"
                                    autocomplete="new-password"
                                    required
                                >
                            </div>
                        </div>

                        <div class="field mt-5">
                            <button
                                type="submit"
                                class="button is-primary is-fullwidth"
                            >
                                Create Account
                            </button>
                        </div>
                    </form>

                    <p class="has-text-centered mt-5">
                        Already have an account?
                        <a href="/login">Log in</a>
                    </p>

                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
